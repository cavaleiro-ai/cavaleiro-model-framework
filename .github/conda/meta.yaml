{% set name = "transformers" %}

package:
  name: "{{ name|lower }}"
  version: "{{ TRANSFORMERS_VERSION }}"

source:
  path: ../../

build:
  noarch: python

requirements:
  host:
    - python
    - pip
    - numpy >=1.17
    - dataclasses
    - huggingface_hub
    - packaging
    - filelock
    - tqdm >=4.60
    - sacremoses
    - regex !=2019.12.17
    - protobuf
    - tokenizers >=0.11.1,!=0.11.3,<0.13
    - pyyaml >=5.1
    - safetensors
    - fsspec
  run:
    - python
    - numpy >=1.17
    - dataclasses
    - huggingface_hub
    - packaging
    - filelock
    - tqdm >=4.60
    - sacremoses
    - regex !=2019.12.17
    - protobuf
    - tokenizers >=0.11.1,!=0.11.3,<0.13
    - pyyaml >=5.1
    - safetensors
    - fsspec

test:
  imports:
    - transformers

about:
  home: https://github.com/cavaleiro-ai/cavaleiro-model-framework
  license: Apache License 2.0
  license_file: LICENSE
  summary: "Cavaleiro Model Framework: the model-definition framework for text, vision, audio, video, and multimodal models."
